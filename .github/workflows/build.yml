name: Build
on:
  merge_group:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

# Cancel previous runs of this workflow on new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build components
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set date as version
        run: |
          echo "time=$(date +"%Y%m%d.%H%M")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Builds the release artifacts of the library
      - name: Builds all artifacts
        run: ./gradlew build
        env:
          ORG_GRADLE_PROJECT_VERSION: ${{ env.time }}
          KRONOR_MERCHANT_TOKEN: dummytoken
