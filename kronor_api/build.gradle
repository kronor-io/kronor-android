plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id("com.apollographql.apollo").version("4.4.1")
    id 'maven-publish'
    id 'signing'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId 'io.kronor'
            artifactId 'api'
            version rootProject.ext['version']

            afterEvaluate {
                from components.release
            }

            pom {
                name = 'api'
                url = 'https://github.com/kronor-io/kronor-android'
                description = 'Kronor API component for Kronor SDK'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/kronor-io/kronor-android/blob/main/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'iAmMrinal0'
                        name = 'Mrinal Purohit'
                        email = 'mrinal@kronor.io'
                    }
                    developer {
                        id = 'pranaysashank'
                        name = 'Pranay Sashank'
                        email = 'pranay.sashank@kronor.io'
                    }
                }
                scm {
                    connection = 'scm:git:github.com/kronor-io/kronor-android.git'
                    developerConnection = 'scm:git:ssh://github.com/kronor-io/kronor-android.git'
                    url = 'https://github.com/kronor-io/kronor-android/tree/main'
                }
            }
        }
    }
}

def kronorSdkVersion = project.hasProperty('VERSION') ? project.property('VERSION') : System.getenv('KRONOR_SDK_VERSION') ?: '"dev"'

android {
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
    namespace 'io.kronor.api'
    compileSdk 36

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        aarMetadata {
            minCompileSdk = 21
        }

        buildConfigField("String", "VERSION", "\"${kronorSdkVersion}\"")

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    publishing {
        singleVariant("release") {}
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

apollo {
    service("service") {
        packageName.set("io.kronor.api")
        mapScalarToKotlinString("bigint")
        mapScalarToKotlinString("uuid")
        mapScalar("timestamptz", "java.util.Date", "com.apollographql.adapter.core.DateAdapter")
        schemaFile.set(file("src/main/graphql/schema.graphqls"))
    }
}

dependencies {

    implementation "androidx.core:core-ktx:$core_ktx_version"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.10.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation('com.apollographql.apollo:apollo-runtime:4.4.1')
    implementation('com.apollographql.adapters:apollo-adapters-core:0.7.0')
}

android.buildFeatures.buildConfig = true

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"
