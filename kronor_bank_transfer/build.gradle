plugins {
    id 'kronor.android.published-library'
    id 'kronor.android.compose'
}

kronorPublishing {
    groupId.set('io.kronor.component')
    artifactId.set('bank_transfer')
    displayName.set('bank_transfer')
    description.set('Kronor Bank Transfer Component for Kronor API')
}

android {
    namespace = 'io.kronor.component.bank_transfer'
    lint.disable.add('MissingTranslation')
}

dependencies {
    implementation libs.androidx.compose.animation
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material
    implementation libs.apollo.api
    implementation libs.zxing
    implementation libs.statemachine
    implementation libs.trustly

    testImplementation libs.junit4
    androidTestImplementation libs.androidx.test.ext.junit
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
    lintChecks libs.compose.lint.checks

    api project(':kronor_api')
}
