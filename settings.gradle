pluginManagement {
    includeBuild('build-logic')
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

plugins {
    id 'com.autonomousapps.build-health' version '3.18.0'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Kronor SDK"
include ':kronor_swish'
include ':kronor_api'
include ':example-app'
include ':kronor_credit_card'
include ':kronor_webview_payment_gateway'
include ':kronor_mobilepay'
include ':kronor_vipps'
include ':kronor_paypal'
include ':kronor_fallback'
include ':kronor_bank_transfer'
include ':kronor_googlepay'
